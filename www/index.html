<style>

.bd{position:absolute;right:4px;bottom:3px;color:#fff;font-size:12px;font-weight:600;text-shadow:0 1px 3px #000}

:root{--acc:#007aff;--card:#f2f2f7;--bar:rgba(255,255,255,.82)}
header{padding:10px 14px 6px}h1{font-size:34px;font-weight:800;letter-spacing:-1px}
.sub{color:var(--mut);font-weight:600;font-size:15px}

.bd{background:rgba(0,0,0,.45);border-radius:14px;padding:2px 8px}

.hs{display:flex;gap:12px;overflow-x:auto;padding:0 14px}
.cd{flex:0 0 auto;width:150px;aspect-ratio:1;border-radius:22px;overflow:hidden;position:relative;background:var(--card);cursor:pointer;color:#fff;font-weight:700;display:flex;align-items:flex-end}
.cd.big{width:290px}.cd img,.cd video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cd span{position:relative;padding:10px 12px;text-shadow:0 1px 5px rgba(0,0,0,.6);font-size:15px;z-index:1}.cd.big span{font-size:26px}.cd small{font-size:16px;font-weight:600}
.plb{position:absolute;right:14px;bottom:14px;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.45);color:#fff;font-size:20px;padding:0;z-index:2}

.pr h3{margin:0;font-size:20px}.pr p{margin:0;color:var(--mut);font-size:14px;flex-basis:100%}.pr .go{background:var(--acc);color:#fff;border-radius:24px;padding:11px 22px;font-weight:600}
.tp{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px}.tp button{background:var(--card);border-radius:16px;padding:16px 14px;text-align:left;font-weight:500;display:flex;justify-content:space-between;color:var(--fg)}.tp small{color:var(--mut)}
.bar{height:6px;background:rgba(120,120,128,.25);border-radius:4px;flex-basis:100%}.bar i{display:block;height:100%;background:var(--acc);border-radius:4px}

</style></head>
<body>
<header id="hd"></header><main id="main"></main>
<nav class="tb"><div class="pill"><button data-t="lib"><b>▦</b>Biblioteca</button><button data-t="alb"><b>❏</b>Álbumes</button></div><button class="gear" id="gear">⚙</button></nav><div class="ab" id="ab"></div>

<script>
const $=s=>document.querySelector(s),E=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=d=>new Date(d).toLocaleDateString('es',{day:'numeric',month:'long',year:'numeric'});
let items=[],tab='lib',filt='all',q='',cur=null,ed=null,ev=null;
const F=[['all','Todo'],['photo','Fotos'],['video','Vídeos'],['fav','Favoritos'],['edit','Editadas'],['loc','Con ubicación']];
const P=[['Original',''],['Vívido','saturate(1.4) contrast(1.1)'],['Dramático','contrast(1.4) saturate(.8) brightness(.9)'],['Cálido','sepia(.35) saturate(1.3) brightness(1.05)'],['Frío','hue-rotate(15deg) saturate(1.1) brightness(1.05)'],['Mono','grayscale(1)'],['Noir','grayscale(1) contrast(1.5) brightness(.9)'],['Plata','grayscale(1) brightness(1.1) contrast(.9)'],['Desvanecido','contrast(.8) brightness(1.15) saturate(.8)'],['Vintage','sepia(.6) contrast(.9) hue-rotate(-10deg)'],['Chrome','contrast(1.3) saturate(1.3) brightness(1.05)'],['Instantánea','sepia(.25) contrast(1.1) saturate(1.2) hue-rotate(-8deg) brightness(1.08)'],['Atardecer','sepia(.4) saturate(1.7) hue-rotate(-15deg) brightness(1.05)'],['Océano','hue-rotate(25deg) saturate(1.3) contrast(1.05)'],['Bosque','hue-rotate(-30deg) saturate(1.2) contrast(1.05)'],['Cine','contrast(1.25) saturate(.85) sepia(.15) brightness(.92)'],['Pop','saturate(2) contrast(1.15)'],['Sepia','sepia(1)'],['Alto brillo','brightness(1.25) contrast(.95) saturate(1.1)'],['Neón','saturate(2.2) hue-rotate(-45deg) contrast(1.2)']];
function toast(t){const e=$('#tt');e.textContent=t;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',2600)}
/* almacenamiento persistente */
const dbp=new Promise(r=>{try{const k=indexedDB.open('galeria',1);k.onupgradeneeded=()=>k.result.createObjectStore('i',{keyPath:'id'});k.onsuccess=()=>r(k.result);k.onerror=()=>r(null)}catch(e){r(null)}});
async function put(it){try{const d=await dbp;if(!d)return;const{url,...r}=it;d.transaction('i','readwrite').objectStore('i').put(r)}catch(e){}}
async function rm(id){try{const d=await dbp;if(d)d.transaction('i','readwrite').objectStore('i').delete(id)}catch(e){}}
async function load(){try{const d=await dbp;if(!d)return;const r=d.transaction('i').objectStore('i').getAll();r.onsuccess=()=>{items=r.result.map(x=>({...x,url:URL.createObjectURL(x.blob)}));purge();render()}}catch(e){}}
function add(o){const it={id:Date.now()+Math.random(),fav:0,edited:0,loc:null,date:Date.now(),...o};it.url=URL.createObjectURL(it.blob);items.push(it);put(it);meta(it);return it}
$('#fi').onchange=e=>{[...e.target.files].forEach(f=>add({blob:f,type:f.type.startsWith('video')?'video':'photo',name:f.name,date:f.lastModified||Date.now()}));e.target.value='';render();toast('Importado')};
function samples(){const cols=[['#ff9a5a','#7b2ff7'],['#36d1dc','#5b86e5'],['#f7971e','#ffd200'],['#11998e','#38ef7d'],['#ee0979','#ff6a00'],['#2c3e50','#4ca1af']];cols.forEach((c,n)=>{const cv=document.createElement('canvas');cv.width=1200;cv.height=900;const x=cv.getContext('2d'),g=x.createLinearGradient(0,0,1200,900);g.addColorStop(0,c[0]);g.addColorStop(1,c[1]);x.fillStyle=g;x.fillRect(0,0,1200,900);x.fillStyle='rgba(255,255,255,.85)';x.beginPath();x.arc(850,300,110,0,7);x.fill();x.fillStyle='rgba(0,0,0,.35)';x.beginPath();x.moveTo(0,900);x.lineTo(350,430);x.lineTo(700,900);x.fill();x.beginPath();x.moveTo(400,900);x.lineTo(850,520);x.lineTo(1200,900);x.fill();cv.toBlob(b=>{add({blob:b,type:'photo',name:'Ejemplo '+(n+1)+'.jpg',date:Date.now()-n*86400000*9});render()},'image/jpeg',.9)})}
/* colecciones */
let PR={theme:'',cols:3,col:{},pins:['fav','video','shot'],albs:[],trips:0,faces:0},cat='all',sel=new Set(),selMode=0,intent=null,pendS=[];
try{Object.assign(PR,JSON.parse(localStorage.getItem('galP')||'{}'))}catch(e){}
const pSave=()=>{try{localStorage.setItem('galP',JSON.stringify(PR))}catch(e){}};
const theme=()=>PR.theme?document.documentElement.setAttribute('data-theme',PR.theme):document.documentElement.removeAttribute('data-theme');theme();
const fb=b=>b>1e9?(b/1e9).toFixed(1)+' GB':(b/1e6).toFixed(1)+' MB',dur=s=>Math.floor(s/60)+':'+String(Math.round(s%60)).padStart(2,'0'),fd2=d=>new Date(d).toLocaleDateString('es',{month:'short',day:'numeric',year:'numeric'});
const CT={all:'Biblioteca',photo:'Fotos',video:'Vídeos',fav:'Favoritos',edit:'Editadas',loc:'Con ubicación',pano:'Panorámicas',doc:'Documentos',anim:'Animado',shot:'Capturas de pantalla',stick:'Mis stickers',hid:'Ocultos',big:'Archivos grandes',dup:'Duplicados',trash:'Eliminados recientes',face:'Con rostros'};
const catName=c=>CT[c]||(c.startsWith('yr:')?'Recuerdos '+c.slice(3):c.replace(/^(alb|plc):/,''));
function inCat(i,c){if(c==='trash')return!!i.del;if(i.del)return false;if(c==='hid')return!!i.hid;if(i.hid)return false;const t=i.blob.type||'';
 if(c==='all')return true;if(c==='photo'||c==='video')return i.type===c;if(c==='fav')return!!i.fav;if(c==='edit')return!!i.edited;if(c==='loc')return!!i.loc;
 if(c==='pano')return i.type==='photo'&&i.w/i.h>=2.2;if(c==='doc')return!!i.doc;if(c==='anim')return/gif/.test(t);if(c==='shot')return/screenshot|captura|screen/i.test(i.name);if(c==='stick')return/webp/.test(t)||/sticker/i.test(i.name);if(c==='big')return i.blob.size>5e6;if(c==='face')return i.faces>0;
 if(c.startsWith('alb:'))return(i.alb||[]).includes(c.slice(4));if(c.startsWith('yr:'))return new Date(i.date).getFullYear()==c.slice(3);if(c.startsWith('plc:'))return!!i.loc&&i.loc.name===c.slice(4);return false}
function dups(){const m={};items.filter(i=>!i.del).forEach(i=>{const k=i.blob.size+i.blob.type;(m[k]=m[k]||[]).push(i)});return Object.values(m).filter(a=>a.length>1)}
function list(c=cat,nq){let a=c==='dup'?dups().flat().filter(i=>!i.hid):items.filter(i=>inCat(i,c));if(q&&!nq)a=a.filter(i=>(((i.loc&&i.loc.name)||'')+i.name).toLowerCase().includes(q));return a.sort(c==='big'?(x,y)=>y.blob.size-x.blob.size:(x,y)=>y.date-x.date)}
const cnt=c=>list(c,1).length;
function thumb(i){const m=E(i.type==='video'?'video':'img');m.src=i.url;if(i.type==='video'){m.muted=true;m.preload='metadata'}else m.loading='lazy';return m}
function meta(it){if(it.w)return;const done=()=>{put(it);clearTimeout(meta.t);meta.t=setTimeout(render,250)};
 if(it.type==='video'){const v=document.createElement('video');v.preload='metadata';v.onloadedmetadata=()=>{it.w=v.videoWidth;it.h=v.videoHeight;it.dur=v.duration;done()};v.src=it.url;return}
 const im=new Image();im.onload=()=>{it.w=im.naturalWidth;it.h=im.naturalHeight;try{const c=document.createElement('canvas');c.width=c.height=24;const x=c.getContext('2d');x.drawImage(im,0,0,24,24);const d=x.getImageData(0,0,24,24).data;let l=0,s=0;for(let k=0;k<d.length;k+=4){const mx=Math.max(d[k],d[k+1],d[k+2]);if(mx>190)l++;s+=mx-Math.min(d[k],d[k+1],d[k+2])}it.doc=l/576>.6&&s/576<40?1:0}catch(e){}
 if(/jpe?g/i.test(it.blob.type)&&!it.loc)gps(it).then(done);else done()};im.src=it.url}
async function gps(it){try{const d=new DataView(await it.blob.slice(0,131072).arrayBuffer());if(d.getUint16(0)!==0xFFD8)return;let o=2;while(o<d.byteLength-4){const mk=d.getUint16(o),n=d.getUint16(o+2);if(mk===0xFFE1&&d.getUint32(o+4)===0x45786966){const t=o+10,le=d.getUint16(t)===0x4949,u16=p=>d.getUint16(p,le),u32=p=>d.getUint32(p,le),ifd=(p,f)=>{const c=u16(p);for(let k=0;k<c;k++)f(p+2+k*12)},rat=p=>{const q=t+u32(p+8);return[0,1,2].map(i=>u32(q+i*8)/u32(q+i*8+4))};let gp=0;ifd(t+u32(t+4),e=>{if(u16(e)===0x8825)gp=t+u32(e+8)});if(!gp)return;const g={};ifd(gp,e=>{const k=u16(e);if(k===1||k===3)g[k]=String.fromCharCode(d.getUint8(e+8));if(k===2||k===4)g[k]=rat(e)});if(g[2]&&g[4]){const f=a=>a[0]+a[1]/60+a[2]/3600;let la=f(g[2]),lo=f(g[4]);if(g[1]==='S')la=-la;if(g[3]==='W')lo=-lo;it.loc={lat:+la.toFixed(5),lon:+lo.toFixed(5),name:'Zona '+la.toFixed(1)+', '+lo.toFixed(1)};put(it)}return}o+=2+n}}catch(e){}}
function purge(){items.filter(i=>i.del&&Date.now()-i.del>2592e6).forEach(i=>rm(i.id));items=items.filter(i=>!(i.del&&Date.now()-i.del>2592e6));items.forEach(meta)}
function render(){clearInterval(window.sl);const h=$('#hd'),m=$('#main');h.innerHTML='';m.innerHTML='';document.querySelectorAll('.pill button').forEach(b=>b.classList.toggle('on',b.dataset.t===(tab==='lib'?'lib':'alb')));
 if(tab==='lib'||tab==='sub')libV(h,m);else if(tab==='alb')albV(h,m);else plcV(h,m);abUI();selUI()}
